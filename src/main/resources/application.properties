spring.application.name=fit

# Base de datos MySQL. Los valores se pueden cambiar con variables de entorno
# sin tocar este archivo: DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fit?createDatabaseIfNotExist=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
