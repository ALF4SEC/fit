# Perfil "local": base de datos H2 en memoria, para probar la API sin MySQL.
# Los datos se pierden al parar la aplicación.
# Arranque: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:fit;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Consola web de H2 en http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:fit)
spring.h2.console.enabled=true
